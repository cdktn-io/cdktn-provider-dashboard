name: lock
on:
  schedule:
    - cron: '17 7 * * *'
jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      # v6.0.2 is the first release whose schema accepts a token longer than 100
      # chars. GitHub's GITHUB_TOKEN now exceeds that, so every earlier version
      # fails before doing any work with:
      #   "github-token" length must be less than or equal to 100 characters long
      # Note v6.0.0 does NOT fix this -- the schema change landed in v6.0.1.
      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
        with:
          issue-inactive-days: 30
          pr-inactive-days: 7
