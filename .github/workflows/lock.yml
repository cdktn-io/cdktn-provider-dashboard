name: lock
on:
  schedule:
    - cron: '17 7 * * *'
jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Lock closed, inactive issues and PRs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |-
            const INACTIVE_DAYS = { issue: 30, pr: 7 };

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            for (const kind of ["issue", "pr"]) {
              const cutoff = new Date();
              cutoff.setUTCDate(cutoff.getUTCDate() - INACTIVE_DAYS[kind]);
              const cutoffDate = cutoff.toISOString().slice(0, 10);

              const items = await github.paginate(github.rest.search.issuesAndPullRequests, {
                q: `repo:${context.repo.owner}/${context.repo.repo} is:closed is:unlocked is:${kind} closed:<${cutoffDate}`,
                per_page: 100,
              });

              core.info(`Found ${items.length} closed, unlocked ${kind}(s) closed before ${cutoffDate}`);

              for (const item of items) {
                await github.rest.issues.lock({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: item.number,
                });
                core.info(`Locked ${kind} #${item.number}`);
                await sleep(250);
              }
            }
